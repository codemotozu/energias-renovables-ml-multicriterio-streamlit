# Ejecuta las pruebas del tablero en cada push y pull request.
# El despliegue lo hace Streamlit Community Cloud por su cuenta; este flujo solo avisa si algo se rompió.
name: Pruebas del tablero

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            dashboard/requirements.txt
            tests/requirements.txt

      - name: Instalar dependencias
        run: pip install -r tests/requirements.txt

      - name: Ejecutar las pruebas
        run: pytest tests -v
